<!doctype html>
<html lang="en" data-theme="midnight" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="m4ster-tracker - Professional roadmap tracker for product teams"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="m4ster" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>M4ster_Roadmap_Tracker</title>
  </head>
  <body style="background:#1d2125;margin:0">
    <div id="root"></div>
    <!-- Boot guard: if the app bundle fails to load or crashes before
         mounting (stale cache, blocked assets, storage errors), replace the
         blank page with a diagnosable message instead of a white screen. -->
    <div
      id="boot-fail"
      hidden
      style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2125;color:#e6edf3;font-family:system-ui,sans-serif;z-index:9999"
    >
      <div style="text-align:center;max-width:340px;padding:24px">
        <p style="font-size:16px;font-weight:600;margin:0 0 8px">Couldn't load the tracker</p>
        <p style="font-size:13px;color:#8c9bab;margin:0 0 16px">
          The app didn't start. This is usually a stale browser cache — a hard refresh fixes it.
        </p>
        <button
          onclick="location.reload()"
          style="background:#0c66e4;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer"
        >
          Reload app
        </button>
      </div>
    </div>
    <script>
      window.__APP_MOUNTED = false;
      setTimeout(function () {
        if (!window.__APP_MOUNTED) {
          var el = document.getElementById('boot-fail');
          if (el) el.hidden = false;
        }
      }, 9000);
      window.addEventListener('error', function (e) {
        if (!window.__APP_MOUNTED && e.message) {
          var el = document.getElementById('boot-fail');
          if (el) el.hidden = false;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
