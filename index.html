<!doctype html>
<html lang="en" data-theme="midnight" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="M4ster Tracker — project boards, sprints and reports for small teams. Free to start, Pro at $20/year flat."
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta property="og:title" content="M4ster Tracker — Project boards for small teams" />
    <meta property="og:description" content="Project boards, sprints and reports for small teams. Free to start, Pro at $20/year flat." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="m4ster" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>M4ster Tracker — Project boards for small teams</title>
  </head>
  <body style="background: #1d2125; margin: 0">
    <div id="root"></div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2125;color:#fff;font-family:system-ui;padding:24px;text-align:center;">
        <div>
          <h1>M4ster Tracker</h1>
          <p>This app needs JavaScript to run. Please enable JavaScript in your browser.</p>
        </div>
      </div>
    </noscript>
    <!-- Boot guard: if the app bundle fails to load or crashes before
         mounting (stale cache, blocked assets, storage errors), replace the
         blank page with a diagnosable message instead of a white screen. -->
    <div
      id="boot-fail"
      hidden
      style="
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1d2125;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        z-index: 9999;
      "
    >
      <div style="text-align: center; max-width: 340px; padding: 24px">
        <p style="font-size: 16px; font-weight: 600; margin: 0 0 8px">Couldn't load the tracker</p>
        <p style="font-size: 13px; color: #8c9bab; margin: 0 0 16px">
          The app didn't start. This is usually a stale browser cache — a hard refresh fixes it.
        </p>
        <button
          onclick="location.reload()"
          style="
            background: #0c66e4;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
          "
        >
          Reload app
        </button>
      </div>
    </div>
    <script>
      window.__APP_MOUNTED = false;
      setTimeout(function () {
        if (!window.__APP_MOUNTED) {
          var el = document.getElementById('boot-fail');
          if (el) el.hidden = false;
        }
      }, 9000);
      window.addEventListener('error', function (e) {
        if (!window.__APP_MOUNTED && e.message) {
          var el = document.getElementById('boot-fail');
          if (el) el.hidden = false;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
